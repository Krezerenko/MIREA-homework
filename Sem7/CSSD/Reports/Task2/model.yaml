# Карта событий, ПР-2. Платформа хранения игровых повторов (реплеев).
# Единый источник: из него собирается ES_replays.drawio (три листа).
# Раскладка явная: col это столбец на ленте времени, row это строка внутри дорожки контекста.
# Ключи YAML пишутся латиницей и не совпадают со словами on, off, yes, no, y, n.
#
# Сколько клеток занимает шаг:
#   триггер-участник в столбце c:  участник над c, команда c, агрегат c+1, событие c+2
#   триггер-политика в столбце c:  политика c, команда c+1, агрегат c+2, событие c+3
#   alt-событие ставится строкой ниже (main -> branch, branch -> branch2)
#   uses: внешняя система ставится в строку top над агрегатом
#   readmodel: ставится в строку участника слева от него (столбец c-1)

title: "Карта событий. Платформа хранения игровых повторов"

contexts:
  - {id: ingest,  name: "Приём",             rows: [top, actor, main, branch]}
  - {id: catalog, name: "Каталог и доступ",  rows: [top, actor, main, actor2, branch]}
  - {id: store,   name: "Хранение",          rows: [top, main, branch]}

# порядок контекстов на листе «Контексты» (средний получает стрелки с обеих сторон)
ctx_order: [ingest, catalog, store]

actors:
  dev:    "Владелец серверов"
  server: "Выделенный игровой сервер"
  viewer: "Зритель"
  player: "Игрок"

agents: {}

externals:
  storage: "Облачное хранилище"
  notify:  "Служба уведомлений"

readmodels:
  catalog:  {name: "Каталог матчей", from: [e_cat, e_access, e_excl]}
  owner_matches: {name: "Матчи моих серверов", from: [e_cat, e_access]}

aggregates:
  owner:
    name: "Владелец серверов"
    ctx: ingest
    invariants:
      - "Отозванный ключ сервера не становится снова действующим"
      - "Учтённый объём хранения равен сумме объёмов принятых реплеев владельца"
  replay:
    name: "Реплей"
    ctx: ingest
    invariants:
      - "Для одного матча принимается не более одного реплея"
      - "Приём подтверждается только после сохранения файла в хранилище"
      - "Контрольная сумма принятого реплея не меняется"
  card:
    name: "Карточка матча"
    ctx: catalog
    invariants:
      - "Карточка создаётся только для принятого реплея"
      - "Скрытый матч выдаётся только участникам матча и владельцу серверов"
      - "Матч, исключённый из каталога, не выдаётся никому"
  profile:
    name: "Профиль игрока"
    ctx: catalog
    invariants:
      - "Одному аккаунту Steam соответствует не более одного профиля"
      - "После удаления данных игрока профиль не связан ни с одним матчем"
  record:
    name: "Запись в хранилище"
    ctx: store
    invariants:
      - "В холодный класс переводится только запись старше 30 дней"
      - "Удалённая запись не восстанавливается и не выдаётся"

steps:
  # ---------- приём ----------
  - id: s1
    ctx: ingest
    col: 1
    row: main
    trigger: {actor: dev}
    command: "Выпустить ключ сервера"
    target: {aggregate: owner}
    events:
      - {id: e_key, text: "Ключ сервера выпущен"}

  - id: s2
    ctx: ingest
    col: 5
    row: main
    trigger: {actor: server}
    command: "Выгрузить реплей"
    target: {aggregate: replay}
    uses: storage
    events:
      - {id: e_acc, text: "Реплей принят"}
      - {id: e_rej, text: "Реплей отклонён", alt: true}

  - id: s3
    ctx: ingest
    col: 9
    row: main
    trigger: {policy: "Когда реплей принят, то учесть объём в квоте владельца серверов", after: e_acc}
    command: "Учесть объём в квоте"
    target: {aggregate: owner}
    events:
      - {id: e_counted, text: "Объём хранения учтён"}
      - {id: e_quota,   text: "Квота хранения исчерпана", alt: true}

  - id: s4
    ctx: ingest
    col: 14
    row: branch
    trigger: {policy: "Когда квота хранения исчерпана, то уведомить владельца серверов", after: e_quota}
    command: "Уведомить владельца серверов о квоте"
    target: {external: notify}
    events:
      - {id: e_quota_msg, text: "Владелец серверов уведомлён о квоте"}

  # ---------- каталог и доступ ----------
  - id: s5
    ctx: catalog
    col: 9
    row: main
    trigger: {policy: "Когда реплей принят, то внести матч в каталог", after: e_acc, route_dx: -10}
    command: "Внести матч в каталог"
    target: {aggregate: card}
    events:
      - {id: e_cat, text: "Матч внесён в каталог"}

  - id: s6
    ctx: catalog
    col: 13
    row: main
    trigger: {policy: "Когда матч внесён в каталог, то сопоставить матч с профилями участников", after: e_cat}
    command: "Сопоставить матч с профилями участников"
    target: {aggregate: profile}
    events:
      - {id: e_prof, text: "Матч сопоставлен с профилями участников"}

  - id: s8
    ctx: catalog
    col: 10
    row: branch
    trigger: {actor: dev, readmodel: owner_matches}
    command: "Изменить уровень доступа матча"
    target: {aggregate: card}
    events:
      - {id: e_access, text: "Уровень доступа матча изменён"}


  - id: s7
    ctx: catalog
    col: 18
    row: main
    trigger: {actor: viewer, readmodel: catalog}
    command: "Скачать реплей"
    target: {aggregate: card}
    uses: storage
    events:
      - {id: e_given,  text: "Реплей выдан"}
      - {id: e_denied, text: "В выдаче реплея отказано", alt: true}

  - id: s10
    ctx: catalog
    col: 22
    row: main
    trigger: {actor: player}
    command: "Удалить свои данные"
    target: {aggregate: profile}
    events:
      - {id: e_pdel, text: "Данные игрока удалены"}

  - id: s15
    ctx: catalog
    col: 24
    row: branch
    trigger: {policy: "Когда запись удалена по истечении срока, то исключить матч из каталога", after: e_expired}
    command: "Исключить матч из каталога"
    target: {aggregate: card}
    events:
      - {id: e_excl, text: "Матч исключён из каталога"}

  # ---------- хранение ----------
  - id: s12
    ctx: store
    col: 9
    row: main
    trigger: {policy: "Когда реплей принят, то назначить срок хранения", after: e_acc, route_dx: 10}
    command: "Назначить срок хранения"
    target: {aggregate: record}
    events:
      - {id: e_ret, text: "Срок хранения назначен"}

  - id: s13
    ctx: store
    col: 14
    row: main
    trigger: {schedule: "По расписанию переводить записи старше 30 дней в холодный класс"}
    command: "Перевести запись в холодный класс"
    target: {aggregate: record}
    uses: storage
    events:
      - {id: e_cold, text: "Запись переведена в холодный класс"}

  - id: s14
    ctx: store
    col: 19
    row: main
    trigger: {schedule: "По расписанию удалять записи с истёкшим сроком хранения"}
    command: "Удалить запись по истечении срока"
    target: {aggregate: record}
    uses: storage
    events:
      - {id: e_expired, text: "Запись удалена по истечении срока"}

  - id: s16
    ctx: store
    col: 24
    row: main
    trigger: {schedule: "По расписанию сверять каталог с хранилищем"}
    command: "Сверить каталог с хранилищем"
    target: {aggregate: record}
    uses: storage
    events:
      - {id: e_rec,  text: "Сверка каталога с хранилищем выполнена"}
      - {id: e_lost, text: "Утрата записи обнаружена", alt: true}

  - id: s17
    ctx: store
    col: 29
    row: branch
    trigger: {policy: "Когда утрата записи обнаружена, то оповестить дежурного инженера", after: e_lost}
    command: "Оповестить дежурного инженера"
    target: {external: notify}
    events:
      - {id: e_duty, text: "Дежурный инженер оповещён"}

hotspots:
  - {ctx: ingest,  row: top,    col: 5,  about: s2,  text: "Что делать с повторной выгрузкой того же матча: отклонить или заменить запись?"}
  - {ctx: ingest,  row: top,    col: 12, about: s3,  text: "Отклонять ли приём после исчерпания квоты, если это ведёт к потере матчей?"}
  - {ctx: catalog, row: actor2, col: 11, about: s8,  text: "Может ли игрок скрыть публичный матч со своим участием?"}
  - {ctx: catalog, row: top,    col: 20, about: s7,  text: "Выдача реплея это доменное событие, если по ней считаются популярность и трафик?"}
  - {ctx: catalog, row: top,    col: 23, about: s10, text: "Удалять ли реплеи матчей с участием игрока или только обезличить его в них?"}
  - {ctx: store,   row: top,    col: 11, about: s12, text: "Кто задаёт срок хранения: платформа, владелец серверов или игрок, закрепивший свой матч?"}
  - {ctx: store,   row: top,    col: 28, about: s16, text: "Что сообщать владельцу серверов и игрокам, если утраченную запись восстановить нельзя?"}

boundaries:
  - between: [ingest, catalog]
    reason: >-
      Разный состав участников: в Приёме команды отдают игровые серверы, в Каталоге люди
      (игроки, зрители, владелец серверов). Разные требования к согласованности:
      приём подтверждается только после сохранения файла, а в каталоге допускается задержка
      до 60 с (лист требований ПР-1). Разный язык: выгрузка, контрольная сумма, подтверждение
      приёма, квота против матча, участников и уровня доступа.
  - between: [catalog, store]
    reason: >-
      Разный темп изменений: записи в хранилище меняются по расписанию раз в сутки, каталог при
      каждом действии пользователя. Разные участники: в Хранении нет людей, действуют правила
      по расписанию и облачное хранилище. Свой язык: класс хранения, срок хранения, сверка.
  - between: [card, profile]
    kind: not_a_boundary
    reason: >-
      Карточка матча и Профиль игрока остаются в одном контексте: общий язык (матч, участник,
      доступ) и общие участники (игрок, зритель); сопоставление матча с профилями должно быть
      видно в каталоге сразу, без задержки между контекстами.

terms:
  - term: "Реплей"
    meanings:
      ingest:  "Файл матча с контрольной суммой и статусом приёма"
      catalog: "Карточка матча с участниками, тегами и уровнем доступа"
      store:   "Объект в облачном хранилище с классом и сроком хранения"

# Сверка с ПР-1 (идёт в перечень расхождений отчёта)
discrepancies:
  - "Службы уведомлений не было в границах ПР-1: добавлена в «Не входит, внешняя система»."
  - "Роль «Разработчик игры» обобщена до «Владелец серверов»: клиентами платформы могут быть и хосты комьюнити-серверов; ПР-1 исправлена."
  - "Роль «Организатор турнира» и турнирные матчи удалены: отложенная публикация вне проекта; ПР-1 исправлена."
  - "Инженер эксплуатации команд не отдаёт, только получает оповещения: роль в ПР-1 оставить, причину указать в ПР-4."
  - "Владелец платформы команд не отдаёт: его интерес (стоимость) реализован правилом по расписанию о холодном классе."
  - "Облачный провайдер в ПР-1 записан стейкхолдером, на карте это внешняя система: оставить оба, провайдер команд не отдаёт."
  - "Службы аутентификации на карте нет: вход игрока это предусловие команд, а не событие."
  - "Игрок скачивает реплей той же командой, что и зритель; на карте шаг показан с участником «Зритель»."
